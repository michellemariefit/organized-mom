<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Week · The Organized Mom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organized Mom">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="om.css">
<div class="wrap">
  <header class="page"><a class="back" href="start.html">← Home</a><span class="eyebrow">The calendar</span><h1>My week</h1><p class="lead">Every recurring week. Workouts, meals and down time come from their own pages and show up here on their own.</p></header>
  <section class="card">
    <h3>Add something</h3>
    <form class="addform" id="add">
      <input name="label" placeholder="What, e.g. Work, Church, Date night" required>
      <select name="day" required><option value="">Day…</option></select>
      <input name="time" type="time">
      <select name="tag"></select>
      <button class="go" type="submit" style="grid-column:1/-1;padding:14px">Add to my week</button>
    </form>
    <p class="note">If you work, block the work hours and the travel in and out. Mark them Work.</p>
  </section>
  <section id="days" style="display:flex;flex-direction:column;gap:10px"></section>
  <section class="card soft"><h3>Daily, no matter what</h3><div id="daily"></div></section>
</div>
<script src="om.js"></script>
<script>
const f=$('#add');
f.day.innerHTML+=WEEKDAYS_LONG.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
f.tag.innerHTML=TAGS.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('');
f.addEventListener('submit',e=>{e.preventDefault();const w=week();w.push({id:uid(),day:+f.day.value,time:f.time.value,label:f.label.value.trim(),tag:f.tag.value});saveList('om:week',w);f.label.value='';f.time.value='';render();});
function render(){
  const by=weekByDay(), td=(new Date().getDay()+6)%7;
  $('#days').innerHTML=by.map((l,i)=>`<div class="wkday ${i===td?'today':''}"><h3>${WEEKDAYS_LONG[i]}<small>${i===td?'today':''}</small></h3>${l.length?l.map(e=>`<div class="ent"><span class="t">${fmtTime(e.time)||''}</span><span>${esc(e.label)}</span><span style="display:flex;gap:4px;align-items:center">${TAG_LABEL[e.tag]?`<span class="tag ${e.tag}">${TAG_LABEL[e.tag]}</span>`:''}${e.auto?'':`<button class="x" data-rm="${e.id}" aria-label="Remove">×</button>`}</span></div>`).join(''):'<p class="note">Nothing yet.</p>'}</div>`).join('');
  const d=list('om:daily');
  $('#daily').innerHTML=d.length?`<div class="chips">${d.map(x=>`<span class="chip">${esc(x.text)}</span>`).join('')}</div>`:'<p class="note">Set these on Day 1, Step 4.</p>';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;saveList('om:week',week().filter(x=>x.id!==b.dataset.rm));render()});
render();
</script>
