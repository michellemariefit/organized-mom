<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day · The Organized Mom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organized Mom">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="om.css">
<div class="wrap">
  <header class="page"><a class="back" href="start.html">← Home</a></header>
  <section id="head"></section>
  <section id="steps" style="display:flex;flex-direction:column;gap:14px"></section>
  <section id="finish"></section>
  <nav class="daynav" id="nav"></nav>
</div>
<script src="om.js"></script>
<script>
function n(){const x=parseInt(location.hash.slice(1));return x>=1&&x<=7?x:1}
function render(){
  const d=DAYS[n()-1], dn=done();
  document.title=`Day ${d.n} · The Organized Mom`;
  $('#head').innerHTML=`<div class="dayhead"><span class="eyebrow">Day ${d.n} of 7</span><h1>${esc(d.title)}</h1><p>${esc(d.sub)}</p></div>`;
  $('#steps').innerHTML=d.steps.map((s,i)=>`<div class="card step"><h3>${esc(s.h)}</h3><div class="copy">${s.html}</div>${s.video?vidHTML(s.video,s.h):''}${s.ws?`<div class="wsbox" data-ws="${s.ws}"></div>`:''}${s.link?`<a class="go quiet" href="${s.link[0]}">${esc(s.link[1])}</a>`:''}</div>`).join('');
  $$('.wsbox').forEach(b=>renderWS(b.dataset.ws,b));
  // the aspect sheets follow the aspects list
  const ab=$('.wsbox[data-ws=aspects]'), sb=$('.wsbox[data-ws=sheets]');
  if(ab&&sb){const re=()=>renderWS('sheets',sb);ab.addEventListener('click',()=>setTimeout(re,0));ab.addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(re,600)})}
  $('#finish').innerHTML=dn[d.n]?`<div class="card gold"><h3>Day ${d.n} done ✓</h3><p>Finished ${esc(dn[d.n])}. You can come back and change anything, any time.</p><button class="pill" id="undo">Mark as not done</button></div>`
    :`<button class="go" id="doneBtn">I've done Day ${d.n} ✓</button>`;
  $('#nav').innerHTML=`${d.n>1?`<a class="pill" href="#${d.n-1}">← Day ${d.n-1}</a>`:'<span></span>'}${d.n<7?`<a class="pill" href="#${d.n+1}">Day ${d.n+1} →</a>`:'<a class="pill" href="start.html">Home →</a>'}`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  if(e.target.id==='doneBtn'){if(!started())store.set('om:started',TODAY);setDone(n(),true);render();}
  if(e.target.id==='undo'){setDone(n(),false);render();}
});
window.addEventListener('hashchange',render);
render();
</script>
