<div class="wrap">
  <header class="page"><a class="back" href="start.html">← Home</a><span class="eyebrow">From Day 5</span><h1>Meals and groceries</h1><p class="lead">Protein, carb, vegetable, every night. Clear the dinners on meal planning day and start again.</p></header>
  <section class="card"><h3>Grocery list</h3><div id="grocery"></div><div class="toolrow"><button class="pill" id="clearDone">Clear ticked items</button></div></section>
  <section class="card"><h3>This week's dinners</h3><div id="meals"></div><div class="toolrow"><button class="pill" id="clearMeals">Clear the dinners for a new week</button></div></section>
  <section class="card"><h3>Cook nights</h3><div id="cook"></div></section>
  <section class="card"><h3>Planning day and grocery day</h3><div id="mealday"></div></section>
  <section class="card"><h3>My 3 workouts</h3><div id="workouts"></div></section>
</div>
<script src="om.js"></script>
<script>
function render(){renderWS('grocery',$('#grocery'));renderWS('meals',$('#meals'));renderWS('cook',$('#cook'));renderWS('mealday',$('#mealday'));renderWS('workouts',$('#workouts'))}
render();
$('#clearDone').addEventListener('click',()=>{saveList('om:grocery',list('om:grocery').filter(x=>!x.done));renderWS('grocery',$('#grocery'))});
$('#clearMeals').addEventListener('click',()=>{store.set('om:meals',{});renderWS('meals',$('#meals'))});
</script>
