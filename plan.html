  <header class="page"><a class="back" href="start.html">← Home</a><span class="eyebrow">From Day 1</span><h1>My aspects and goals</h1><p class="lead">In priority order. Tap an aspect to see what you're not happy with, your goals, your top 3 and the plan.</p></header>

<script>
function render(){renderWS('aspects',$('#aspects'));renderWS('sheets',$('#sheets'));renderWS('daily',$('#daily'));renderWS('weekly',$('#weekly'))}
render();
// when aspects change, the sheet tabs need to follow
$('#aspects').addEventListener('click',()=>setTimeout(()=>renderWS('sheets',$('#sheets')),0));
$('#aspects').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(()=>renderWS('sheets',$('#sheets')),600)});
</script>
