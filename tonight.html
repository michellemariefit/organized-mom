<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight · The Organized Mom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organized Mom">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="om.css">
<div class="wrap">
  <header class="page"><a class="back" href="start.html">← Home</a><span class="eyebrow">Note to self</span><h1 id="h">Tonight</h1><p class="lead">After you look at tomorrow's calendar. Think of everything you did today. Commend yourself for it. Be grateful for it.</p></header>
  <section id="help"></section>
  <section class="card ws">
    <label>What I did today<textarea id="did" rows="5" placeholder="Everything you got done. Every moment with the kids, 5 minutes or 2 hours."></textarea></label>
    <label>What I'm grateful for<textarea id="grateful" rows="3" placeholder="Three things is plenty."></textarea></label>
    <p class="note">You are amazing. No more putting ourselves down. Saved as you type.</p>
  </section>
  <section class="card soft"><h3>Tomorrow</h3><div id="tomorrow"></div><a class="pill" href="week.html">Open my week</a></section>
  <section class="card"><h3>Past nights</h3><div id="past"></div></section>
</div>
<script src="om.js"></script>
<script>
const d=TODAY, n={did:'',grateful:'',...notes()[d]};
$('#help').innerHTML=helpHTML('tonight');
$('#did').value=n.did;$('#grateful').value=n.grateful;
document.addEventListener('input',e=>{if(e.target.id==='did'||e.target.id==='grateful'){n[e.target.id]=e.target.value;setNote(d,n)}});
const tm=(new Date().getDay()+6)%7, tmi=(tm+1)%7, by=weekByDay();
$('#tomorrow').innerHTML=`<p><b>${WEEKDAYS_LONG[tmi]}</b></p>`+(by[tmi].length?by[tmi].map(e=>`<div class="ent"><span class="t">${fmtTime(e.time)}</span><span>${esc(e.label)}</span><span></span></div>`).join(''):'<p class="note">Nothing on the calendar.</p>');
const past=Object.entries(notes()).filter(([k])=>k!==d).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
$('#past').innerHTML=past.length?past.map(([k,v])=>`<div style="padding:8px 0;border-top:1px dashed var(--line)"><span class="eyebrow">${k}</span><p>${esc(v.did||'')}</p>${v.grateful?`<p class="note">Grateful: ${esc(v.grateful)}</p>`:''}</div>`).join(''):'<p class="note">Your first one is tonight.</p>';
</script>
